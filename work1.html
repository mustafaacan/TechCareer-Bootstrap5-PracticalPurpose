<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Grid Layout, Cdn, Template, Container</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS v5.2.1 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />

    <style>
        .row > div{

            margin: 20px 5px;
            width: calc(33.33% - 10px);
        }


    </style>

  </head>

  <body>
    <header>
      <!-- place navbar here -->
    </header>
    <main>
      <!-- before start (if you have Boostrap 5 Quick Snippet or similar plugin) enter "bs" or "bs-5". there will be 
       automatically generated HTML template with comments  -->

        <div class="container">
            <div class="row g-2">
            <div class="col-md-4 col-sm-12 bg-primary text-white">
                <p>Column 1</p>
            </div>
            <div class="col-md-4 col-sm-12 bg-secondary text-white">
                <p>Column 2</p>
            </div>
            <div class="col-md-4 col-sm-12 bg-success text-white">
                <p>Column 3</p>
            </div>
            </div>

    </main>
    <footer>
      <!-- place footer here -->
    </footer>
    <!-- Bootstrap JavaScript Libraries -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
