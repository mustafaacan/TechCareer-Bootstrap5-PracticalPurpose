<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Margin, Button, Padding, Link, Display</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS v5.2.1 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <header>
      <!-- place navbar here -->
    </header>
    <main>
      <h1 class="h1 m-2">Margin</h1>
      <p class="text-primary border border-2 border-danger rounded-1 m-1 mb-3">
        Margin-1
      </p>
      <p class="text-primary border border-2 border-danger rounded-1 m-2">
        Margin-2
      </p>
      <p class="text-primary border border-2 border-danger rounded-1 m-3">
        Margin-3
      </p>
      <p class="text-primary border border-2 border-danger rounded-1 m-4">
        Margin-4
      </p>
      <p class="text-primary border border-2 border-danger rounded-1 mx-5">
        MarginX-1
      </p>

      <h1 class="h1 m-2">Padding</h1>
      <p class="text-primary border border-2 border-danger rounded-1 m-3 p-4">
        Padding-1
      </p>

      <h1 class="h1 m-2">Button</h1>
      <button class="m-2">Classic</button>
      <button class="btn btn-primary d-block m-2">btn button</button>
      <button class="btn btn-outline-danger d-block m-2">
        btn danger outline button
      </button>
      <button class="btn btn-link d-block m-2">link button</button>

      <h1 class="h1 m-2">Link</h1>
      <a href="#" class="link-danger m-3 d-inline">link danger</a>
      <a href="#" class="link-info m-3 d-inline">link info</a>
    </main>
    <footer>
      <!-- place footer here -->
    </footer>
    <!-- Bootstrap JavaScript Libraries -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
